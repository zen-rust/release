[package]
name = "zen_git_cmd"
version = "0.0.2"
edition.workspace = true
description = "Wrapper around git cli"
repository = "https://github.com/zen-rust/release/tree/main/packages/git_cmd"
license.workspace = true
keywords = ["git", "command", "cli", "wrapper", "shell"]
categories = ["development-tools", "filesystem"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
test_fixture = []

[dependencies]
anyhow.workspace = true
camino.workspace = true
tracing.workspace = true
fs-err.workspace = true

[dev-dependencies]
git_cmd = { path = ".", package = "zen_git_cmd", features = ["test_fixture"] }
test_logs = { path = "../test_logs", package = "zen_test_logs" }

tempfile.workspace = true
