[package]
name = "zen_release"
version = "0.0.1"
edition.workspace = true
description = "Update version and changelog based on semantic versioning and conventional commits"
repository = "https://github.com/zen-rust/release"
homepage = "https://github.com/zen-rust/release"
license.workspace = true
readme = "../../README.md"
keywords = ["release", "please", "semver", "conventional", "commits"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "zen-release"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["docker-tests", "all-static"]
# Run tests that need a docker runtime to be executed
docker-tests = []
all-static = ["zen_release_core/all-static"]

[dependencies]
git_cmd = { path = "../git_cmd", version = "0.0.1" }
zen_release_core = { path = "../release_core", version = "0.0.1", default-features = false }
cargo_utils = { path = "../cargo_utils", version = "0.0.1" }

anyhow.workspace = true
base64.workspace = true
cargo_metadata.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete.workspace = true
dirs.workspace = true
fs-err.workspace = true
git-cliff-core.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
cargo_utils = { path = "../cargo_utils" }
test_logs = { path = "../test_logs" }
fake_package = { path = "../fake_package" }

assert_cmd.workspace = true
fake.workspace = true
expect-test.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml_edit.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/zen-release-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
