[workspace]
git_release_enable = false
dependencies_update = false # TODO: re-enable when `cargo update` works in this project

# Jetstream Labs conventional-commit rules (see AGENTS.md "Default conventional-commit rules").
# `wip` and `chore` commits do not trigger a release.
no_increment_regex = "^(wip|chore)"
# NOTE: `custom_major_increment_regex = "^breaking"` (breaking -> major) is intentionally
# omitted while zen-release is pre-1.0, so releases stay under 1.0. Enable it at 1.x.
# (Scope-based `none` rules — feat(style):/feat(test): — are not expressible via a type regex
# yet; tracked as a future enhancement.)

git_release_body = """
{{ changelog }}
{% if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
* @{{ contributor.username }}
{% endfor %}
{% endif %}
"""

[[package]] # the double square brackets define a TOML table array
name = "zen_release" # name of the package to configure
changelog_include = ["zen_release_core"] # include commits from `release_core` in the changelog
# set the path of the changelog to the root of the repository
changelog_path = "./CHANGELOG.md"
git_release_enable = true # create GitHub release
